<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richfield — Sign In</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/Mystylein.css" />
  <script>
    // A malformed preference value must never prevent the login page from loading.
    (function () {
      try {
        const prefs = JSON.parse(localStorage.getItem('rc_prefs') || '{}');
        if (prefs.theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (error) {
        console.warn('Theme preferences could not be read:', error);
      }
    })();
  </script>
</head>
<body class="mood-page-background">
  <nav class="navbar mood-page-navbar">
    <div class="nav-brand-container">
      <img src="img/richfieldlogo.jpg" alt="Richfield Logo" class="brand-logo-img" />
      <div class="nav-text-block">
        <span class="brand">Richfield.Connect</span>
        <span class="campus">Umhlanga Campus</span>
      </div>
    </div>
  </nav>

  <main class="main mood-page-main">
    <div class="card-heading centered-heading">
      <h1 class="white-text large-title">Welcome back!</h1>
      <p class="desatured-white-text">Log in with your student number or email and password</p>
    </div>

    <div class="card mood-page-card">
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="studentNum">Student Number or Email</label>
          <div class="input-wrap">
            <input
              type="text"
              id="studentNum"
              name="identifier"
              placeholder="e.g. 2024001 or name@example.com"
              autocomplete="username"
              required
            />
          </div>
          <span class="err-msg" id="numErr">Please enter your student number or email.</span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              class="password-input"
              name="password"
              placeholder="Your password"
              autocomplete="current-password"
              required
            />
            <button type="button" class="toggle-pass" id="togglePassBtn" aria-label="Show password" aria-pressed="false">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <span class="err-msg" id="passErr">Please enter your password.</span>
        </div>

        <p id="loginStatus" role="status" aria-live="polite" style="min-height:18px;font-size:13px;font-weight:600;"></p>

        <button type="submit" class="btn-login" id="loginBtn">
          <span id="btnText">Log In</span>
          <div class="spinner" id="spinner"></div>
        </button>
      </form>
    </div>

    <p class="footer-link">Don't have an account? <a href="Signup.html">Sign up</a></p>
  </main>

  <script>
    'use strict';

    // The project currently runs the Express API on port 5001.
    // If you later deploy the project, change this to your deployed API origin.
    const API_BASE = 'http://127.0.0.1:5001';

    function togglePass() {
      const passInput = document.getElementById('password');
      const btn = document.getElementById('togglePassBtn');
      if (!passInput || !btn) return;
      const showing = passInput.type === 'password';
      passInput.type = showing ? 'text' : 'password';
      btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
      btn.setAttribute('aria-pressed', String(showing));
    }

    function setLoginStatus(message, isError = true) {
      const status = document.getElementById('loginStatus');
      if (!status) return;
      status.textContent = message;
      status.style.color = isError ? '#dc2626' : '#15803d';
    }

    async function handleLogin(event) {
      event.preventDefault();

      const identifier = document.getElementById('studentNum').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');

      if (!identifier || !password) {
        setLoginStatus('Please enter your student number/email and password.');
        return;
      }
      if (/\s/.test(identifier)) {
        setLoginStatus('Your student number or email cannot contain spaces.');
        return;
      }
      if (/\s/.test(password)) {
        setLoginStatus('Password cannot contain spaces.');
        return;
      }

      if (loginBtn) loginBtn.disabled = true;
      if (btnText) btnText.style.display = 'none';
      if (spinner) spinner.style.display = 'block';
      setLoginStatus('Signing in…', false);

      try {
        const response = await fetch(`${API_BASE}/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || `Login failed (${response.status}).`);
        }
        if (!data.user || typeof data.user !== 'object') {
          throw new Error('The server did not return a valid user profile.');
        }

        // Only the role saved in the database determines the redirect.
        // Missing/unknown roles are treated as student, never as admin.
        const user = { ...data.user };
        delete user.password;
        delete user.verificationToken;
        user.role = String(user.role || 'student').toLowerCase();

        // Keep the key already used by Dashboard.js and Profile.html.
        localStorage.setItem('currentUser', JSON.stringify(user));
        localStorage.setItem('userId', String(user.id || ''));

        if (user.role === 'admin') {
          window.location.assign('admin/AdminDashboard.html');
        } else {
          window.location.assign('Dashboard.html');
        }
      } catch (error) {
        console.error('Login error:', error);
        setLoginStatus(error.message || 'Unable to sign in. Please try again.');
      } finally {
        if (spinner) spinner.style.display = 'none';
        if (btnText) {
          btnText.textContent = 'Log In';
          btnText.style.display = 'inline';
        }
        if (loginBtn) loginBtn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('togglePassBtn')?.addEventListener('click', togglePass);
      document.getElementById('loginForm')?.addEventListener('submit', handleLogin);
    });
  </script>
</body>
</html>
