<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Glitch Invaders</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #0d1117; color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Crucial: Prevents pull-to-refresh and scrolling on mobile */
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #hud {
            position: absolute;
            top: 10px;
            width: 90%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            z-index: 10;
            text-shadow: 1px 1px 2px black;
        }
        #trivia-box {
            position: absolute;
            top: 50px;
            width: 90%;
            max-width: 600px;
            background: rgba(22, 27, 34, 0.85);
            border: 2px solid #3fb950;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            z-index: 10;
        }
        canvas {
            display: block;
            background: #000;
            box-shadow: 0 0 15px rgba(63, 185, 80, 0.2);
        }
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #8b949e;
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <span id="scoreDisplay">Score: 0</span>
        <span id="livesDisplay">Lives: 3</span>
    </div>

    <div id="trivia-box">
        <h3 id="questionText" style="margin: 0; color: #58a6ff;">Loading Target Data...</h3>
    </div>

    <canvas id="gameCanvas"></canvas>

    <div id="mobile-controls">Tap & Hold Left/Right sides to move and shoot</div>
</div>

<script src="game.js"></script>
</body>
</html>
